spring:
  application:
    name: deepdataagent-backend

datasource:
  encryption:
    key: ${DATASOURCE_ENCRYPTION_KEY:change-me-please-change-me-please-32b}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml

server:
  port: ${SERVER_PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

app:
  sqlite:
    path: ${APP_SQLITE_PATH:}
  memory:
    root-path: ${APP_MEMORY_ROOT_PATH:}
    index:
      db-path: ${APP_MEMORY_INDEX_DB_PATH:}
      rebuild-on-startup: ${APP_MEMORY_INDEX_REBUILD_ON_STARTUP:true}
    chunking:
      max-chars: ${APP_MEMORY_CHUNKING_MAX_CHARS:1200}
      overlap-chars: ${APP_MEMORY_CHUNKING_OVERLAP_CHARS:120}
    retrieve:
      top-k: ${APP_MEMORY_RETRIEVE_TOP_K:8}
      max-chars: ${APP_MEMORY_RETRIEVE_MAX_CHARS:4000}
      rrf-k: ${APP_MEMORY_RETRIEVE_RRF_K:60}
      min-score: ${APP_MEMORY_RETRIEVE_MIN_SCORE:0.0}
    record:
      min-round-size: ${APP_MEMORY_RECORD_MIN_ROUND_SIZE:2}
      capture-full-conversation: ${APP_MEMORY_RECORD_CAPTURE_FULL_CONVERSATION:true}
    temporal:
      recall-boost-factor: ${APP_MEMORY_TEMPORAL_RECALL_BOOST_FACTOR:0.2}
    io:
      cache:
        preload-files:
          - MEMORY.md
          - USER.md
        flush-on-record: ${APP_MEMORY_IO_FLUSH_ON_RECORD:true}
        max-cache-size: ${APP_MEMORY_IO_MAX_CACHE_SIZE:200}
    vector:
      enabled: ${APP_MEMORY_VECTOR_ENABLED:true}
      dimension: ${APP_MEMORY_VECTOR_DIMENSION:1536}
      distance-metric: ${APP_MEMORY_VECTOR_DISTANCE_METRIC:cosine}
      persistence-path: ${APP_MEMORY_VECTOR_PERSISTENCE_PATH:}
      max-degree: ${APP_MEMORY_VECTOR_MAX_DEGREE:16}
      beam-width: ${APP_MEMORY_VECTOR_BEAM_WIDTH:100}
      neighbor-overflow: ${APP_MEMORY_VECTOR_NEIGHBOR_OVERFLOW:1.2}
      alpha: ${APP_MEMORY_VECTOR_ALPHA:1.2}
      rebuild-threshold: ${APP_MEMORY_VECTOR_REBUILD_THRESHOLD:0}
  embedding:
    base-url: ${APP_EMBEDDING_BASE_URL:https://api.openai.com/v1}
    api-key: ${APP_EMBEDDING_API_KEY:}
    model: ${APP_EMBEDDING_MODEL:text-embedding-3-small}
    dimension: ${APP_EMBEDDING_DIMENSION:1536}
  data-analysis:
    query:
      max-rows: ${APP_DATA_ANALYSIS_MAX_ROWS:1000}
      timeout-seconds: ${APP_DATA_ANALYSIS_TIMEOUT:30}
    max-retry-count: ${APP_DATA_ANALYSIS_MAX_RETRY:3}
  session:
    max-active-sessions: ${APP_SESSION_MAX_ACTIVE:100}
    context-load-size: ${APP_SESSION_CONTEXT_LOAD_SIZE:5}
  web-search:
    api-key: ${APP_WEB_SEARCH_API_KEY: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}
    endpoint: ${APP_WEB_SEARCH_ENDPOINT:https://api.tavily.com/search}
    max-results: ${APP_WEB_SEARCH_MAX_RESULTS:5}
    timeout-seconds: ${APP_WEB_SEARCH_TIMEOUT:10}
    enabled: ${APP_WEB_SEARCH_ENABLED:true}
  agent:
    sys-prompt: ${APP_AGENT_SYS_PROMPT:}
    api-sys-prompt: ${APP_AGENT_API_SYS_PROMPT:}
    memory:
      # 框架记忆工作目录，默认 <项目根>/data/agentscope
      workspace: ${APP_AGENT_MEMORY_WORKSPACE:}
      # 是否启用框架记忆
      enabled: ${APP_AGENT_MEMORY_ENABLED:true}
      # 长期记忆整合最大 token 数
      consolidation-max-tokens: ${APP_AGENT_MEMORY_CONSOLIDATION_MAX_TOKENS:4000}
      # 长期记忆整合最小间隔（毫秒）
      consolidation-min-gap: ${APP_AGENT_MEMORY_CONSOLIDATION_MIN_GAP:3600000}
      # 记忆落盘触发策略：always / never / throttled
      flush-trigger: ${APP_AGENT_MEMORY_FLUSH_TRIGGER:throttled}

sse:
  connection-pool:
    max-active: ${SSE_CONNECTION_POOL_MAX_ACTIVE:500}
    keep-alive-ms: ${SSE_CONNECTION_POOL_KEEP_ALIVE_MS:30000}
  event-bus:
    max-active-sessions: ${SSE_EVENT_BUS_MAX_ACTIVE_SESSIONS:500}
    sink-buffer-size: ${SSE_EVENT_BUS_SINK_BUFFER_SIZE:1024}

agent:
  execution:
    max-active-sessions: ${AGENT_EXECUTION_MAX_ACTIVE_SESSIONS:500}
    virtual-threads: ${AGENT_EXECUTION_VIRTUAL_THREADS:true}
