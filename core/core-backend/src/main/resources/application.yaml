server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: deepdataagent-backend
  jackson:
    # 系统统一使用中国时区：JSON 时间序列化/反序列化对齐 Asia/Shanghai
    time-zone: Asia/Shanghai
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://host.docker.internal:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
      # 每个连接建立时将会话时区对齐中国时区（与迁移脚本 SET TIME ZONE 保持一致，TIMESTAMPTZ 写入/读取口径统一）
      connection-init-sql: SET TIME ZONE 'Asia/Shanghai'
  flyway:
    # SQL 版本管理：迁移脚本位于 classpath:db/migration，V{n}__{描述}.sql 一经应用不可修改
    enabled: true
    locations: classpath:db/migration
    # 兼容存量库：schema 非空但无迁移历史时自动基线到 V1（V1 被跳过，全新库正常完整执行）
    baseline-on-migrate: true
    # 允许乱序执行迁移（例如已应用 V2 后合入 V1.1 补丁），各版本号必须全局唯一
    out-of-order: true
    # 迁移前跳过对已应用脚本的 checksum 校验（配合 out-of-order / 存量脚本调整场景）
    validate-on-migrate: true
    # migrate 前自动执行 repair，清理 schema history 中的失败记录与 obsolete 描述
    repair-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:host.docker.internal}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis}

# ---------- OpenSandbox：代码解释器沙箱接入 ----------
# 默认面向 Docker 部署：服务间经宿主机网关 host.docker.internal 互访；
# 本地原生启动或远程主机部署时，用同名环境变量（APP_OPENSANDBOX_*）覆盖即可
# ---------- Agent 运行时（AgentScope Harness 装配参数） ----------
# 模型字符串 ID（dashscope:qwen-plus / openai:... 等，经 AgentScope ModelRegistry 解析）；
# Docker 沙箱由 backend 调用宿主机 Docker daemon（compose 需挂载 /var/run/docker.sock 或 DIND）
app:
  opensandbox:
    protocol: ${APP_OPENSANDBOX_PROTOCOL:http}
    # OpenSandbox 服务端地址（host:port），对应 compose 的 8090:8080 端口映射
    domain: ${APP_OPENSANDBOX_DOMAIN:host.docker.internal:8090}
    # 须与 deploy/opensandbox/opensandbox.toml 的 [server] api_key 保持一致
    api-key: ${APP_OPENSANDBOX_API_KEY:deepdataagent-internal-key}
    # 经服务端中转发起请求（沙箱端口无需再单独暴露给后端）
    use-server-proxy: ${APP_OPENSANDBOX_USE_SERVER_PROXY:true}
    # 沙箱默认执行镜像（对齐 OpenSandbox 官方示例验证过的版本）
    default-image: ${APP_OPENSANDBOX_DEFAULT_IMAGE:opensandbox/code-interpreter:v1.1.0}
    # 单次沙箱执行超时上限（秒）
    default-timeout-seconds: ${APP_OPENSANDBOX_DEFAULT_TIMEOUT_SECONDS:1800}
  agent:
    model-id: ${APP_AGENT_MODEL_ID:dashscope:qwen-plus}
    system-prompt: ${APP_AGENT_SYSTEM_PROMPT:}
    max-iters: ${APP_AGENT_MAX_ITERS:20}
    sandbox-image: ${APP_AGENT_SANDBOX_IMAGE:ubuntu:22.04}
    # 沙箱内存上限（字节，默认 4GB）
    sandbox-memory-bytes: ${APP_AGENT_SANDBOX_MEMORY_BYTES:4294967296}
    # 沙箱 CPU 核数
    sandbox-cpu-count: ${APP_AGENT_SANDBOX_CPU_COUNT:2}
    workspace-root: ${APP_AGENT_WORKSPACE_ROOT:./.agent-workspace}
    # SSE 连接空闲超时（毫秒）
    sse-timeout: ${APP_AGENT_SSE_TIMEOUT:300000}
    # AgentScope 官方 PG 扩展自动建 schema/表（agentscope.agentscope_sessions / agentscope_snapshots）
    state-schema: ${APP_AGENT_STATE_SCHEMA:agentscope}
    state-table: ${APP_AGENT_STATE_TABLE:agentscope_sessions}
    # 进程重启后将残留 RUNNING 会话恢复为 IDLE，对应轮次置 INTERRUPTED
    startup-recovery-enabled: ${APP_AGENT_STARTUP_RECOVERY_ENABLED:true}
    # 工具调用超时（毫秒）
    tool-timeout: ${APP_AGENT_TOOL_TIMEOUT:120000}

datasource:
  encryption:
    key: ${DATASOURCE_ENCRYPTION_KEY:deepdataagent-pwd}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      # 逻辑删除全局配置：is_deleted = 1 表示已删除，0 表示未删除
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

