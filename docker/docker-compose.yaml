# ===========================================================
# DeepDataAgent - 全量一键编排（总入口）
# 一键启动全部组件：postgresql / redis / opensandbox / backend / frontend
#
# 用法（在项目根目录执行）：
#   docker compose -f docker/docker-compose.yaml up --build
#
# 说明：
#   - 服务间通过宿主机网关（默认 host.docker.internal）通信，
#     基础组件端口发布至宿主机（5432/6379/8090），不依赖共享网络
#   - 数据卷统一命名为 deepdataagent_pgdata / deepdataagent_redisdata
# ===========================================================

name: deepdataagent

services:
  # ---------- PostgreSQL 16（zhparser 镜像）：vector / zhparser / age 三大插件 ----------
  postgresql:
    build:
      context: ..
      dockerfile: docker/postgresql/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # 显式指定 UTF-8 编码，保证中文分词与中文数据正常
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    healthcheck:
      test: [ "CMD-SHELL", "/usr/lib/postgresql/16/bin/pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      # PG16：数据目录位于 /var/lib/postgresql/data
      - pgdata:/var/lib/postgresql/data
    ports:
      # 对外暴露，便于本机 psql/图形化工具连接调试
      - "5432:5432"
    restart: unless-stopped

  # ---------- Redis 8：Schema 缓存、限流与分布式锁 ----------
  redis:
    image: redis:8.10.0-alpine
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-redis}", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis} ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redisdata:/data
    ports:
      # 对外暴露，便于本机 redis-cli / 管理工具连接调试
      - "6379:6379"
    restart: unless-stopped

  # ---------- OpenSandbox：代码解释器沙箱 ----------
  opensandbox:
    build:
      context: ..
      dockerfile: docker/opensandbox/Dockerfile
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    # 端口发布到宿主机，供后端经 host.docker.internal:8090 访问
    ports:
      - "8090:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/health" ]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../deploy/opensandbox/opensandbox.toml:/app/opensandbox.toml:ro
      # 持久化 OpenSandbox 服务端元数据（~/.opensandbox/opensandbox.db）
      - opensandboxdata:/root/.opensandbox

  # ---------- 后端（Spring Boot） ----------
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensandbox:
        condition: service_healthy
    environment:
      # 仅保留运行态开关；连接地址与 OpenSandbox 参数已下沉至后端 application.yaml，
      # 如需覆盖可在启动前设置 SPRING_DATASOURCE_URL / REDIS_HOST / APP_OPENSANDBOX_* 等环境变量
      SPRING_PROFILES_ACTIVE: standalone
    extra_hosts:
      # Linux 下将 host.docker.internal 解析到宿主机网关；Docker Desktop 自带映射，冗余添加无副作用
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/actuator/health" ]
      interval: 20s
      timeout: 5s
      retries: 5
    ports:
      - "18080:8080"
    restart: unless-stopped

  # ---------- 前端（Nginx 托管 Vue 构建产物） ----------
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      # Linux 下将 host.docker.internal 解析到宿主机网关；Docker Desktop 自带映射，冗余添加无副作用
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    restart: unless-stopped

# 数据卷：显式命名，保证与单组件编排（docker-compose.infra.*.yaml）数据互通
volumes:
  pgdata:
    name: deepdataagent_pgdata
  redisdata:
    name: deepdataagent_redisdata
  opensandboxdata:
    name: deepdataagent_opensandboxdata