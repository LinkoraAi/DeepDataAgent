# ===========================================================
# DeepDataAgent - 全量一键编排（总入口）
# 一键启动全部组件：postgresql / redis / backend / frontend
#
# 用法（在项目根目录执行）：
#   docker compose -f docker/docker-compose.yaml up --build
#
# 说明：
#   - 服务间通过宿主机网关（默认 host.docker.internal）通信，
#     基础组件端口发布至宿主机（5432/6379），不依赖共享网络
#   - 数据卷统一命名为 deepdataagent_pgdata / deepdataagent_redisdata
# ===========================================================

name: deepdataagent

services:
  # ---------- PostgreSQL 16（zhparser 镜像）：vector / zhparser / age 三大插件 ----------
  postgresql:
    build:
      context: ..
      dockerfile: docker/postgresql/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # 显式指定 UTF-8 编码，保证中文分词与中文数据正常
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    healthcheck:
      test: [ "CMD-SHELL", "/usr/lib/postgresql/16/bin/pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      # PG16：数据目录位于 /var/lib/postgresql/data
      - pgdata:/var/lib/postgresql/data
    ports:
      # 对外暴露，便于本机 psql/图形化工具连接调试
      - "5432:5432"
    restart: unless-stopped

  # ---------- Redis 8：Schema 缓存、限流与协调租约 ----------
  # 部署红线（move-coordination-leases-to-redis D4）：AOF everysec 持久化租约；
  #   noeviction 禁止内存压力下淘汰租约 key（否则进行中的轮次随机 fail-closed）
  redis:
    image: redis:8.10.0-alpine
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-redis}", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis} ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redisdata:/data
    ports:
      # 对外暴露，便于本机 redis-cli / 管理工具连接调试
      - "6379:6379"
    restart: unless-stopped

  # ---------- 后端（Spring Boot） ----------
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 仅保留运行态开关；连接地址已下沉至后端 application.yaml，
      # 如需覆盖可在启动前设置 SPRING_DATASOURCE_URL / REDIS_HOST 等环境变量
      SPRING_PROFILES_ACTIVE: standalone
      # 模型/凭证库/jwt 密钥：不提供内置默认值，必须由宿主环境变量显式给出（fail-fast），
      # 启动前复制 docker/.env.example 为 docker/.env 并填入随机高熵密钥（≥32 字节）
      APP_MODEL_ENCRYPTION_KEY: ${APP_MODEL_ENCRYPTION_KEY:?APP_MODEL_ENCRYPTION_KEY 未设置：请复制 docker/.env.example 为 docker/.env 并提供随机 32 字节以上密钥}
      APP_VAULT_ENCRYPTION_KEY: ${APP_VAULT_ENCRYPTION_KEY:?APP_VAULT_ENCRYPTION_KEY 未设置：请复制 docker/.env.example 为 docker/.env 并提供随机 32 字节以上密钥}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET 未设置：请复制 docker/.env.example 为 docker/.env 并提供随机 32 字节以上密钥}
      # 协调租约唯一存储为 Redis（PR-C4 起原 db / redis 二选一开关随 PG 实现一并下线，回滚只能整版本回退）
      # turn 租约续约承载形态（D5③ 容量预案）：scheduler（默认平台池）/ virtual-thread（每轮虚拟线程）
      APP_COORDINATION_LEASE_RENEWAL: ${APP_COORDINATION_LEASE_RENEWAL:-scheduler}
      # 对象存储（file 内容 + skill 资产统一承载）：默认 local（单机 / 开发，容器内本地盘，
      # 不跨实例共享）；多实例 / 生产设 APP_STORAGE_TYPE=rustfs|minio|oss 并补全 S3 连接参数
      APP_STORAGE_TYPE: ${APP_STORAGE_TYPE:-local}
      APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET:-deepdataagent}
      APP_STORAGE_LOCAL_ROOT: ${APP_STORAGE_LOCAL_ROOT:-./data/objects}
      APP_STORAGE_ENDPOINT: ${APP_STORAGE_ENDPOINT:-}
      APP_STORAGE_ACCESS_KEY: ${APP_STORAGE_ACCESS_KEY:-}
      APP_STORAGE_SECRET_KEY: ${APP_STORAGE_SECRET_KEY:-}
      APP_STORAGE_REGION: ${APP_STORAGE_REGION:-us-east-1}
      APP_STORAGE_PATH_STYLE: ${APP_STORAGE_PATH_STYLE:-true}
    extra_hosts:
      # Linux 下将 host.docker.internal 解析到宿主机网关；Docker Desktop 自带映射，冗余添加无副作用
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/actuator/health" ]
      interval: 20s
      timeout: 5s
      retries: 5
    ports:
      - "18080:8080"
    restart: unless-stopped

  # ---------- 前端（Nginx 托管 Vue 构建产物） ----------
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      # Linux 下将 host.docker.internal 解析到宿主机网关；Docker Desktop 自带映射，冗余添加无副作用
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    restart: unless-stopped

# 数据卷：显式命名，保证与单组件编排（docker-compose.infra.*.yaml）数据互通
volumes:
  pgdata:
    name: deepdataagent_pgdata
  redisdata:
    name: deepdataagent_redisdata