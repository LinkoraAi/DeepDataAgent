# ===========================================================
# DeepDataAgent - 后端纯服务编排
# 仅启动 Spring Boot 后端。PostgreSQL/Redis/OpenSandbox 通过
# 宿主机网关（默认 host.docker.internal）访问，不依赖任何共享 Docker 网络：
#   - postgresql   已发布端口 5432
#   - redis        已发布端口 6379
#   - opensandbox  已发布端口 8090
#
# 用法（在项目根目录执行）：
#   docker compose -f docker/docker-compose.backend.yaml up --build
#   （先启动基础建设：docker compose -f docker/docker-compose.infra.yaml up --build）
#
# 说明：
#   - 跨编排无法使用 depends_on，后端启动后若基础建设健康即可正常注册
#   - 连接地址与 OpenSandbox 参数已下沉至后端 application.yaml；
#     如需覆盖，启动前设置 SPRING_DATASOURCE_URL / REDIS_HOST / APP_OPENSANDBOX_* 等环境变量即可
# ===========================================================

name: deepdataagent-backend

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    environment:
      # 仅保留运行态开关；连接地址与 OpenSandbox 参数已下沉至后端 application.yaml，
      # 如需覆盖可在启动前设置 SPRING_DATASOURCE_URL / REDIS_HOST / APP_OPENSANDBOX_* 等环境变量
      SPRING_PROFILES_ACTIVE: standalone
      # 模型凭证加密密钥（yaml 层无默认值：缺省使用开发默认值，生产务必经宿主环境变量覆盖）
      APP_MODEL_ENCRYPTION_KEY: ${APP_MODEL_ENCRYPTION_KEY:-deepdataagent-model-secret}
    extra_hosts:
      # Linux 下将 host.docker.internal 解析到宿主机网关；Docker Desktop 自带映射，冗余添加无副作用
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/actuator/health" ]
      interval: 20s
      timeout: 5s
      retries: 5
    ports:
      - "18080:8080"
    restart: unless-stopped