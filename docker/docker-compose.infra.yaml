# ===========================================================
# DeepDataAgent - 基础建设汇总编排
# 仅启动基础组件：postgresql / redis / opensandbox
# 后端与前端可基于此编排分别独立启动。
#
# 用法（在项目根目录执行）：
#   docker compose -f docker/docker-compose.infra.yaml up --build
# ===========================================================

name: deepdataagent-infra

services:
  # PostgreSQL 16（zhparser 镜像）：vector / zhparser / age 三大插件
  postgresql:
    build:
      context: ..
      dockerfile: docker/postgresql/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # 显式指定 UTF-8 编码，保证中文分词与中文数据正常
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    healthcheck:
      test: [ "CMD-SHELL", "/usr/lib/postgresql/16/bin/pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      # PG16：数据目录位于 /var/lib/postgresql/data
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Redis 8：Schema 缓存、限流与分布式锁
  redis:
    image: redis:8.10.0-alpine
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-redis}", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis} ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  # OpenSandbox：代码解释器沙箱
  opensandbox:
    build:
      context: ..
      dockerfile: docker/opensandbox/Dockerfile
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    # 端口发布到宿主机，供后端经 host.docker.internal:8090 访问
    ports:
      - "8090:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/health" ]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../deploy/opensandbox/opensandbox.toml:/app/opensandbox.toml:ro
      # 持久化 OpenSandbox 服务端元数据（~/.opensandbox/opensandbox.db）
      - opensandboxdata:/root/.opensandbox

volumes:
  pgdata:
    name: deepdataagent_pgdata
  redisdata:
    name: deepdataagent_redisdata
  opensandboxdata:
    name: deepdataagent_opensandboxdata