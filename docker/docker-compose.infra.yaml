# ===========================================================
# DeepDataAgent - 基础建设汇总编排
# 默认仅启动基础组件：postgresql / redis
# 后端与前端可基于此编排分别独立启动。
#
# 用法（在项目根目录执行）：
#   docker compose -f docker/docker-compose.infra.yaml up --build
#
# 可选：本地联调 S3 兼容对象存储（MinIO，默认不启动，按需显式开启 profile）
#   docker compose -f docker/docker-compose.infra.yaml --profile minio up --build
#   随后后端配置 APP_STORAGE_TYPE=minio
#     APP_STORAGE_ENDPOINT=http://host.docker.internal:9000
#     APP_STORAGE_ACCESS_KEY=minioadmin / APP_STORAGE_SECRET_KEY=minioadmin
#     APP_STORAGE_PATH_STYLE=true，桶由后端首启自动创建
# ===========================================================

name: deepdataagent-infra

services:
  # PostgreSQL 18（源码编译三扩展）：vector / zhparser / pg_textsearch，不含 Apache AGE
  #   启动须知：pg_textsearch 依赖 shared_preload_libraries 预加载，参数已内置于镜像 CMD
  #   （postgres -c shared_preload_libraries=pg_textsearch），docker run 不必重复传参；
  #   但本服务一旦配置 command 就会整体覆盖 CMD 使扩展不可用，必须配置时须完整写成
  #   command: [ "postgres", "-c", "shared_preload_libraries=pg_textsearch" ]，
  #   且首位必须是 postgres（否则 entrypoint 跳过 initdb.d，扩展与 zhparser_cfg 不创建）
  postgresql:
    build:
      context: ..
      dockerfile: docker/postgresql/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # 显式指定 UTF-8 编码，保证中文分词与中文数据正常
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    healthcheck:
      test: [ "CMD-SHELL", "/usr/lib/postgresql/18/bin/pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      # PG18：数据目录位于 /var/lib/postgresql/data
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # pg_textsearch 的 memtable 缓存使用共享内存（posix DSM 段落在 /dev/shm）：
    # 上游 pg_textsearch.memory_limit 默认 2GB 保持不改，故此处留 4GB 以容纳
    # 2GB 缓存预算 + shared_buffers(默认 128MB) + 并行查询 DSM 段 + 余量。
    # /dev/shm 是 tmpfs，按实际用量分配、不预占物理内存，设 4GB 不会真的吃掉 4GB。
    shm_size: "4gb"
    restart: unless-stopped

  # Redis 8：Schema 缓存、限流与协调租约（move-coordination-leases-to-redis D4 部署红线）
  #   appendonly yes + appendfsync everysec：租约持久化，进程重启不丢运行中的锁；
  #   maxmemory-policy noeviction：租约 key 只由 TTL 过期，禁止内存压力淘汰（否则随机 fail-closed）
  redis:
    image: redis:8.10.0-alpine
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-redis}", "--appendonly", "yes",
      "--appendfsync", "everysec", "--maxmemory-policy", "noeviction" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis} ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ---------- MinIO（S3 兼容对象存储，可选 profile=minio，默认不启动） ----------
  # 本地联调 S3 后端用；生产请使用受管的 RustFS / MinIO / OSS。
  # 9000=S3 API（后端经 host.docker.internal:9000 访问），9001=管理控制台
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${APP_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${APP_STORAGE_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

volumes:
  pgdata:
    name: deepdataagent_pgdata
  redisdata:
    name: deepdataagent_redisdata
  miniodata:
    name: deepdataagent_miniodata