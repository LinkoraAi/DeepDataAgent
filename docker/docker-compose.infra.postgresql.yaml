# ===========================================================
# DeepDataAgent - 基础建设：PostgreSQL 单组件编排
# 仅启动 PostgreSQL 18（内置 vector / zhparser / pg_textsearch 三大插件）。
#
# 用法（在项目根目录执行）：
#   docker compose -f docker/docker-compose.infra.postgresql.yaml up --build
#
# 说明：数据卷 deepdataagent_pgdata 与全量编排共用，切换编排方式数据不丢失
# 注意：单组件编排独立运行（不依赖共享网络），服务通信走宿主机网关 host.docker.internal
# 启动须知：pg_textsearch 必须由 shared_preload_libraries 在 postmaster 启动时预加载，
#   该参数已内置于镜像 CMD（postgres -c shared_preload_libraries=pg_textsearch），故本编排
#   无需也不要在 docker run 里重复传参；但一旦自定义 postgresql 的 command，就会整体覆盖
#   CMD 并导致扩展不可用，此时必须完整写成
#   command: [ "postgres", "-c", "shared_preload_libraries=pg_textsearch" ]
#   （首位必须是 postgres，否则 entrypoint 跳过 /docker-entrypoint-initdb.d，
#     扩展与 zhparser_cfg 均不会创建）。
# ===========================================================

name: deepdataagent-postgresql

services:
  postgresql:
    build:
      context: ..
      dockerfile: docker/postgresql/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # 显式指定 UTF-8 编码，保证中文分词与中文数据正常
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    healthcheck:
      test: [ "CMD-SHELL", "/usr/lib/postgresql/18/bin/pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      # PG18：数据目录位于 /var/lib/postgresql/data
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # pg_textsearch 的 memtable 缓存使用共享内存（posix DSM 段落在 /dev/shm）：
    # 上游 pg_textsearch.memory_limit 默认 2GB 保持不改，故此处留 4GB 以容纳
    # 2GB 缓存预算 + shared_buffers(默认 128MB) + 并行查询 DSM 段 + 余量。
    # /dev/shm 是 tmpfs，按实际用量分配、不预占物理内存，设 4GB 不会真的吃掉 4GB。
    shm_size: "4gb"
    restart: unless-stopped

volumes:
  pgdata:
    name: deepdataagent_pgdata