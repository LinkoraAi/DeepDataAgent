# ===========================================================
# DeepDataAgent - 基础建设：PostgreSQL 单组件编排
# 仅启动 PostgreSQL 16（内置 vector / zhparser / age 三大插件）。
#
# 用法（在项目根目录执行）：
#   docker compose -f docker/docker-compose.infra.postgresql.yaml up --build
#
# 说明：数据卷 deepdataagent_pgdata 与全量编排共用，切换编排方式数据不丢失
# 注意：单组件编排独立运行（不依赖共享网络），服务通信走宿主机网关 host.docker.internal
# ===========================================================

name: deepdataagent-postgresql

services:
  postgresql:
    build:
      context: ..
      dockerfile: docker/postgresql/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # 显式指定 UTF-8 编码，保证中文分词与中文数据正常
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    healthcheck:
      test: [ "CMD-SHELL", "/usr/lib/postgresql/16/bin/pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      # PG16：数据目录位于 /var/lib/postgresql/data
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  pgdata:
    name: deepdataagent_pgdata