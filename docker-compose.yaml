services:
  # PostgreSQL 18：内置 vector（向量）/ zhparser（中英文分词）/ age（图谱）三大插件
  postgresql:
    build:
      context: .
      dockerfile: Dockerfile.postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # 显式指定 UTF-8 编码，保证中文分词与中文数据正常
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    healthcheck:
      test: [ "CMD-SHELL", "/usr/lib/postgresql/18/bin/pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      # PG18 起点：VOLUME 从 /var/lib/postgresql/data 迁至 /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    ports:
      # 对外暴露，便于本机 psql/图形化工具连接调试
      - "5432:5432"
    restart: unless-stopped

  # Redis 8：Schema 缓存、限流与分布式锁
  redis:
    image: redis:8.10-alpine
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-redis}", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis} ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redisdata:/data
    ports:
      # 对外暴露，便于本机 redis-cli / 管理工具连接调试
      - "6379:6379"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensandbox:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: standalone
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
      OPEN_SANDBOX_PROTOCOL: http
      OPEN_SANDBOX_DOMAIN: opensandbox:8080
      OPEN_SANDBOX_API_KEY: ${OPEN_SANDBOX_API_KEY:-deepdataagent-internal-key}
      OPEN_SANDBOX_USE_SERVER_PROXY: "true"
      OPEN_SANDBOX_DEFAULT_IMAGE: ${OPEN_SANDBOX_DEFAULT_IMAGE:-opensandbox/code-interpreter:latest}
      OPEN_SANDBOX_DEFAULT_TIMEOUT_SECONDS: "1800"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/actuator/health" ]
      interval: 20s
      timeout: 5s
      retries: 5
    ports:
      - "18080:8080"
    restart: unless-stopped

  opensandbox:
    build:
      context: .
      dockerfile: Dockerfile.opensandbox
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/health" ]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy/opensandbox/opensandbox.toml:/app/opensandbox.toml:ro

volumes:
  pgdata:
  redisdata: